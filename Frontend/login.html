<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LectureNotes Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-container {
            display: flex;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            overflow: hidden;
            width: 900px;
            max-width: 95%;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
        }
        .login-image {
            flex: 1.2;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 60px;
            text-align: center;
            position: relative;
        }
        .login-image::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.1;
        }
        .login-image img {
            width: 200px;
            margin-bottom: 30px;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.2));
            animation: float 6s ease-in-out infinite;
            z-index: 1;
        }
        .login-image h3 { font-size: 2rem; margin-bottom: 1rem; z-index: 1; }
        .login-image p { font-size: 1.1rem; opacity: 0.9; z-index: 1; }
        
        .login-form {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-form h2 { font-size: 2.5rem; margin-bottom: 2rem; letter-spacing: -1px; }
        .login-form button {
            padding: 1rem;
            font-size: 1.1rem;
            margin-top: 1rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
        }
        .signup-link {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-muted);
        }
        .signup-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
        
        @media(max-width: 850px) {
            .login-image { display: none; }
            .login-container { width: 500px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-image">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" alt="Icon">
            <h3>Welcome Back!</h3>
            <p>Access your lecture summaries and stay organized.</p>
        </div>
        <div class="login-form">
            <h2>Login</h2>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button onclick="handleLogin()">Login</button>
            <div class="signup-link">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
