<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | LectureNotes Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            display: flex;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            overflow: hidden;
            width: 800px;
            max-width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .login-image {
            flex: 1;
            background: linear-gradient(135deg, #ff512f 0%, #dd2476 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px;
            text-align: center;
        }
        .login-image img {
            width: 150px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        .login-form {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
        }
        .login-form h2 { margin-bottom: 20px; }
        .login-form input {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .login-form input::placeholder { color: rgba(255,255,255,0.6); }
        .login-form button {
            margin-top: 20px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff512f, #dd2476);
        }
        .signup-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
        .signup-link a { color: #fff; font-weight: bold; text-decoration: none; }
        
        @media(max-width: 768px) {
            .login-image { display: none; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-image">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" alt="Icon">
            <h3>Join Us!</h3>
            <p>Start sharing your summaries and help fellow students.</p>
        </div>
        <div class="login-form">
            <h2>Sign Up</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button onclick="handleSignup()">Sign Up</button>
            <div class="signup-link">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
